<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Трекер воды</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eaf6ff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
    text-align:center;
}

h1{
    color:#2196f3;
}

#progress{
    font-size:28px;
    margin:20px 0;
    font-weight:bold;
}

button{
    border:none;
    padding:15px 20px;
    margin:10px;
    border-radius:12px;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.add{
    background:#2196f3;
}

.reset{
    background:#f44336;
}
</style>

</head>
<body>

<div class="card">
<h1>💧 Трекер воды</h1>

<div id="progress">0 / 2000 мл</div>

<button class="add" onclick="addWater()">+250 мл</button>

<button class="reset" onclick="resetWater()">Сброс</button>
</div>

<script>

let water = 0;

function addWater(){
    water += 250;

    if(water > 2000){
        water = 2000;
    }

    document.getElementById("progress").innerText = water + " / 2000 мл";
}

function resetWater(){
    water = 0;
    document.getElementById("progress").innerText = "0 / 2000 мл";
}

</script>

</body>
</html>
